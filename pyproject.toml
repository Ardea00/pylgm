[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylgm"
version = "0.3.0"
description = "General-purpose latent Gaussian models for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Panozzo" }]
keywords = ["latent gaussian models", "bayesian", "inla", "laplace approximation", "statistics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Operating System :: OS Independent",
]
dependencies = [
  "formulaic>=1.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
docs = ["mkdocs-material>=9.5"]
spark = ["pyspark>=3.5"]

[project.urls]
Homepage = "https://github.com/Ardea00/pylgm"
Repository = "https://github.com/Ardea00/pylgm"
Issues = "https://github.com/Ardea00/pylgm/issues"

[project.scripts]
pylgm = "pylgm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pylgm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin an explicit, narrow rule set: ruff's default set widens across releases,
# so an unpinned `ruff>=0.9` flags a different number of issues per version.
# This is ruff's classic default and leaves the tree clean.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Spark test modules must import after pytest.importorskip("pyspark").
"tests/data/test_spark.py" = ["E402"]
"tests/test_model_spark.py" = ["E402"]
