name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      # -n auto: the suite is xdist-clean and dominated by a few
      # large sparse fits, so wall time roughly halves.
      - run: pytest -q -n auto

  release-gate:
    # Non-editable install exercises the real hatchling build and the console
    # entry point exactly as `pip install pylgm` would for a released user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: pylgm --help

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,spark]"
      # Spark and Java are provisioned here, so these tests must run unskipped.
      - run: pytest tests/data/test_spark.py tests/test_model_spark.py -q
