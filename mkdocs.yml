site_name: pyLGM
site_description: General-purpose latent Gaussian models for Python
repo_url: https://github.com/Ardea00/pylgm
repo_name: Ardea00/pylgm

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

# Design/spec history lives in-repo under docs/design/ but is not part of the
# published site.
exclude_docs: |
  design/

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Guide:
      - Likelihoods: likelihoods.md
      - Effects: effects.md
      - Spatial effects: spatial-effects.md
      - Empirical Bayes and priors: empirical-bayes.md
      - INLA integration: inla.md
      - Prediction: prediction.md
      - Spark: spark.md
  - Examples:
      - All examples: examples.md
      - Disease mapping (spatial): examples-disease-mapping.md
      - Count regression: examples-count-regression.md
  - Comparison: comparison.md
  - Theory: theory.md
  - Internals & release policy: internals.md
  - Roadmap: roadmap.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

# MathJax, loaded from the CDN. `generic: true` above makes arithmatex emit
# \(...\) / \[...\] delimiters, which this config wires to MathJax v3.
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
